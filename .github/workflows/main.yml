name: Deploy DMMM to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dmmm/package-lock.json

      - name: Install packages
        working-directory: ./dmmm
        run: npm ci

      - name: Build website
        working-directory: ./dmmm
        run: npm run build

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dmmm/dist

      - name: Publish website
        uses: actions/deploy-pages@v4
